# Spring Application Configuration
spring.application.name=order-management-system

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/oms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5c8d0b2a4e6f8a1c3d5e7f9a2b4c6d8e0f1a3b5c7d9e1f2a
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.oms=DEBUG
logging.level.org.springframework.security=INFO
