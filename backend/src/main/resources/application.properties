# Spring Application Configuration
spring.application.name=order-management-system

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration
# Each value can be overridden with an environment variable (used when deployed);
# the defaults keep local development working exactly as before.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password@20}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0b2a4e6f8a1c3d5e7f9a2b4c6d8e0f1a3b5c7d9e1f2a}
app.jwt.expiration-ms=86400000

# CORS: comma-separated browser origins allowed to call the API directly.
# Not needed when the frontend proxies /api (docker-compose setup); set it if the
# frontend is hosted on a different domain from the backend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.oms=DEBUG
logging.level.org.springframework.security=INFO
